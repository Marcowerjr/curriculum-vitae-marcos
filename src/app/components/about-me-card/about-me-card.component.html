<article class="section-card about-card">
  <div class="about-header">
    <ion-avatar>
      <ion-img [alt]="profile.name" [src]="profile.avatar"></ion-img>
    </ion-avatar>

    <div class="about-heading">
      <span class="eyebrow">Resumen ejecutivo</span>
      <h2>{{ profile.name }}</h2>
      <p>{{ profile.location }}</p>
    </div>
  </div>

  <p class="about-summary">{{ profile.summary }}</p>

  <ul class="focus-list">
    @for (item of profile.focusAreas; track item) {
    <li>{{ item }}</li>
    }
  </ul>
</article>
